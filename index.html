<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Board — ADHD Soundboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>🎧 Focus Board</h1>
    <div class="topbar-controls">
      <button id="theme-toggle" class="icon-btn" title="Toggle light/dark" aria-label="Toggle theme">🌙</button>
      <button id="stop-all" class="icon-btn" title="Stop all sounds" aria-label="Stop all sounds">⏹</button>
    </div>
  </header>

  <main>
    <section class="panel timer-panel" aria-label="Focus timer">
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-phase" id="timer-phase">Focus session</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-reset" class="btn">Reset</button>
      </div>
      <div class="timer-settings">
        <label>Focus
          <input type="number" id="focus-minutes" min="1" max="120" value="25" />
        </label>
        <label>Break
          <input type="number" id="break-minutes" min="1" max="60" value="5" />
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="timer-chime" checked />
          Chime on phase change
        </label>
      </div>
    </section>

    <section class="panel" aria-label="Sound mixer">
      <div class="panel-header">
        <h2>Sound Mix</h2>
        <label class="master-volume">
          Master
          <input type="range" id="master-volume" min="0" max="100" value="70" />
        </label>
      </div>
      <div id="sound-grid" class="sound-grid"></div>
    </section>

    <section class="panel" aria-label="Presets">
      <div class="panel-header">
        <h2>Presets</h2>
      </div>
      <div class="preset-row">
        <input type="text" id="preset-name" placeholder="Name this mix…" maxlength="40" />
        <button id="preset-save" class="btn btn-primary">Save mix</button>
      </div>
      <ul id="preset-list" class="preset-list"></ul>
    </section>
  </main>

  <footer class="footer">
    All sounds are generated live in your browser (Web Audio API) — nothing to download, nothing tracked. Your mix and presets are saved only on this device.
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
